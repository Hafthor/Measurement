name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Measurement.slnx

      - name: Build
        run: dotnet build Measurement.slnx --configuration Release --no-restore -p:EnforceCodeStyleInBuild=true

      - name: Test
        run: dotnet test Measurement.slnx --configuration Release --no-build --verbosity normal

      - name: Pack (library only)
        run: dotnet pack Measurement/Measurement.csproj --configuration Release --output ./artifacts

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: nupkg
          path: ./artifacts/*.nupkg
